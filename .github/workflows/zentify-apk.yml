# Place this file at .github/workflows/zentify-apk.yml in your repository.
#
# It works with either layout:
#   A) the repo root contains Zentify-source.zip  -> the workflow unzips it, or
#   B) the repo root already contains the project (a gradlew file at the root).
#
# Run it from Actions > Build Zentify APK > Run workflow. It also runs on its own
# whenever Zentify-source.zip changes on main. The default is an optimized, signed
# release build; with no secrets set, a signing key is created and cached automatically.

name: Build Zentify APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "release is optimized and fast (use this); debug is slow and only for troubleshooting"
        type: choice
        options: [release, debug]
        default: release
      publish_release:
        description: Attach the APK to a GitHub Release (easiest to download on a phone)
        type: boolean
        default: true
      opus_ref:
        description: "libopus branch or tag (empty = newest vX.Y.Z tag)"
        type: string
        default: ""
      metroproto_ref:
        description: "metroproto branch or tag (empty = default branch)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["Zentify-source.zip"]

permissions:
  contents: write # lets the job create the GitHub Release

concurrency:
  group: zentify-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  VARIANT: ${{ inputs.variant || 'release' }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish_release }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Locate or unzip the project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew ]]; then
            dir="$GITHUB_WORKSPACE"
          else
            zip="$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)"
            [[ -n "$zip" ]] || { echo "::error::No gradlew and no .zip found in the repository root"; exit 1; }
            echo "Unzipping $zip"
            mkdir -p "$GITHUB_WORKSPACE/zentify-src"
            unzip -q "$zip" -d "$GITHUB_WORKSPACE/zentify-src"
            gradlew="$(find "$GITHUB_WORKSPACE/zentify-src" -maxdepth 3 -name gradlew | head -n 1)"
            [[ -n "$gradlew" ]] || { echo "::error::gradlew not found inside $zip"; exit 1; }
            dir="$(dirname "$gradlew")"
          fi
          echo "Project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # GitHub's "Download ZIP" leaves out git submodules, so fetch the two the build needs.
      - name: Fetch metroproto and libopus
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          OPUS_REF: ${{ inputs.opus_ref }}
          PROTO_REF: ${{ inputs.metroproto_ref }}
        run: |
          set -euo pipefail

          proto_files="$(find metroproto -name '*.proto' 2>/dev/null | wc -l)"
          if [[ "$proto_files" -eq 0 ]]; then
            rm -rf metroproto
            args=(--depth 1)
            [[ -n "$PROTO_REF" ]] && args+=(--branch "$PROTO_REF")
            git clone "${args[@]}" https://github.com/MetrolistGroup/metroproto.git metroproto
          fi

          opus_dir=opusDecoder/src/main/jni/libopus
          if [[ ! -f "$opus_dir/CMakeLists.txt" ]]; then
            ref="$OPUS_REF"
            if [[ -z "$ref" ]]; then
              ref="$(git ls-remote --tags --refs https://github.com/xiph/opus.git 'v*' \
                | sed 's|.*refs/tags/||' \
                | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
                | sort -V | tail -n 1)"
            fi
            [[ -n "$ref" ]] || { echo "::error::Could not determine a libopus tag"; exit 1; }
            echo "libopus ref: $ref"
            rm -rf "$opus_dir"
            git clone --depth 1 --branch "$ref" https://github.com/xiph/opus.git "$opus_dir"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      # Private repos get small runners (about 7 GB RAM); swap keeps R8 and the NDK build from being killed.
      - name: Add swap
        shell: bash
        run: |
          sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || echo "Swap not added"

      # Debug builds are signed with an auto-generated key. Caching it keeps later builds installable over earlier ones.
      - name: Keep a stable debug signing key
        if: env.VARIANT == 'debug'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.android/debug.keystore
          key: zentify-debug-keystore-v1

      # Without signing secrets, a release key is generated once and kept in the Actions cache,
      # so later builds install over earlier ones. If GitHub evicts the cache, uninstall first.
      - name: Restore auto-generated release key
        if: env.VARIANT == 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/zentify-signing
          key: zentify-release-keystore-v1

      - name: Prepare release signing
        if: env.VARIANT == 'release'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              [[ -n "${!name}" ]] || { echo "::error::Repository secret $name is missing"; exit 1; }
            done
            keystore="$RUNNER_TEMP/zentify.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            [[ -s "$keystore" ]] || { echo "::error::KEYSTORE_BASE64 decoded to an empty file"; exit 1; }
            echo "Using the signing key from repository secrets"
          else
            dir="$HOME/zentify-signing"
            mkdir -p "$dir"
            keystore="$dir/zentify.keystore"
            if [[ ! -f "$keystore" || ! -f "$dir/signing.env" ]]; then
              pass="$(openssl rand -hex 16)"
              keytool -genkeypair -keystore "$keystore" -alias zentify -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Zentify, O=Zentify, C=US"
              printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=zentify\n' "$pass" "$pass" > "$dir/signing.env"
              echo "::notice::Generated a new signing key. Later builds reuse it while the Actions cache keeps it."
            else
              echo "Reusing the cached signing key"
            fi
            # shellcheck disable=SC1091
            source "$dir/signing.env"
            echo "::add-mask::$KEYSTORE_PASSWORD"
          fi
          {
            echo "KEYSTORE_PATH=$keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # A "+" in the version also switches off the app's crash reporting to upstream's Sentry.
      - name: Compute version
        id: ver
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          base="$(sed -n 's/^appVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          base="${base%%+*}"
          [[ -n "$base" ]] || { echo "::error::appVersion not found in gradle.properties"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_appVersion=${base}+zentify.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          SENTRY_IGNORE_ERRORS: "true"
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i '/^org.gradle.java.home=/d' gradle.properties

          mem_gb="$(awk '/MemTotal/ { printf "%d", $2 / 1024 / 1024 * 0.75 }' /proc/meminfo)"
          (( mem_gb < 4 )) && mem_gb=4

          if [[ "$VARIANT" == "release" ]]; then
            tasks=(":androidApp:assembleRelease" "--no-configuration-cache" "-x" ":androidApp:lintVitalRelease")
          else
            tasks=(":androidApp:assembleDebug")
          fi

          ./gradlew "${tasks[@]}" --no-daemon --stacktrace --max-workers="$(nproc)" \
            "-Dorg.gradle.jvmargs=-Xmx${mem_gb}g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Collect and verify APK
        id: apk
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          BASE_VERSION: ${{ steps.ver.outputs.base }}
        run: |
          set -euo pipefail
          apk="$(find "androidApp/build/outputs/apk/$VARIANT" -name '*.apk' | head -n 1)"
          [[ -n "$apk" ]] || { echo "::error::No APK was produced for $VARIANT"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist"
          out="$GITHUB_WORKSPACE/dist/Zentify-${BASE_VERSION}-b${GITHUB_RUN_NUMBER}-${VARIANT}.apk"
          cp "$apk" "$out"

          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$apksigner" ]]; then
            "$apksigner" verify --print-certs "$out"
          else
            echo "::warning::apksigner not found; skipped signature check"
          fi
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Zentify-${{ env.VARIANT }}-b${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: zentify-b${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Zentify build ${GITHUB_RUN_NUMBER} (${VARIANT})" \
            --notes "Built from commit ${GITHUB_SHA}. Zentify is a GPL-3.0 fork of Metrolist."
            
